{{- $fullname := include "underwriter.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "underwriter.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # ClusterIP (tylko wewnatrz klastra) - odpowiednik ingressu wewnetrznego "uw-api"
  # na Container Apps (SPEC_ETAP9.md pkt 1). Frontend woła po tej nazwie.
  type: ClusterIP
  selector:
    {{- include "underwriter.selectorLabels" (dict "root" $ "component" "api") | nindent 4 }}
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "underwriter.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "underwriter.selectorLabels" (dict "root" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      # Zmiana ConfigMap/Secret (np. MODEL_AGENTA, DATABASE_URL) sama nie restartuje
      # podow - envFrom czyta wartosci tylko przy starcie. Suma kontrolna w szablonie
      # poda wymusza rollout przy kazdej zmianie (haslo Postgresa jest stabilne dzieki
      # lookup w secrets.yaml, wiec bez zmian konfiguracji suma tez sie nie zmienia).
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-api.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "underwriter.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      # fsGroup 1000: Dockerfile tworzy "uzytkownik" z uid/gid 1000 (useradd --uid 1000) i
      # na nim dziala kontener (USER uzytkownik) - bez fsGroup emptyDir ponizej (/tmp,
      # /app/.cache_ocr) powstalby jako root:root i nie byłby zapisywalny.
      securityContext:
        fsGroup: 1000
      # Nie wypuszcza kontenera API, dopoki schemat nie jest na "head" - migracje robi
      # osobny Job raz na wydanie (job-migracje.yaml), ten initContainer tylko CZYTA
      # wersje (`alembic current`), wiec przy wielu replikach nie ma wyscigu.
      initContainers:
        - name: czekaj-na-schemat
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              until alembic current 2>/dev/null | grep -q "(head)"; do
                echo "Schemat jeszcze nie na head - czekam na Job migracji..."
                sleep 3
              done
          envFrom:
            - secretRef:
                name: {{ $fullname }}-app
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            {{- include "underwriter.securityContextApi" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migracje.resources | nindent 12 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-api-config
            - secretRef:
                name: {{ $fullname }}-app
          ports:
            - containerPort: 8000
          # /zdrowie (api/trasy.py) robi "SELECT 1" na Postgresie I sprawdza dostepnosc
          # blobu (magazyn.sprawdz_dostepnosc) - zwraca 503, gdy cokolwiek z tego nie
          # dziala. To dokladnie to, co ma badac readiness (wycofaj pod z Service, gdy
          # zaleznosci nie dzialaja) i startup (schemat juz jest dzieki initContainerowi
          # wyzej, ale Azurite moze jeszcze "dociagac" wlasna gotowosc rownolegle z API).
          #
          # Liveness CELOWO NIE uzywa /zdrowie: chwilowa niedostepnosc Postgresa (np.
          # restart StatefulSetu, chwilowy packet loss) nie jest czyms, co restart poda
          # API naprawi - zrestartowany pod i tak dostanie 503 z /zdrowie, dopoki baza
          # nie wroci, wiec restartowanie w kolko tylko mnozy cold-starty i przy wielu
          # replikach grozi restart-stormem w momencie, gdy Postgres akurat ma problem.
          # Sonda TCP na port 8000 sprawdza wylacznie, czy proces uvicorn w ogole zyje
          # i przyjmuje polaczenia - bez dotykania zaleznosci zewnetrznych.
          startupProbe:
            httpGet:
              path: /zdrowie
              port: 8000
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /zdrowie
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache-ocr
              mountPath: /app/.cache_ocr
          securityContext:
            {{- include "underwriter.securityContextApi" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache-ocr
          emptyDir: {}
