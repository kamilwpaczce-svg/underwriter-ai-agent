{{/*
Model: domyslnie deny ingress dla calego wydania (wszystkie pody z etykieta
app.kubernetes.io/instance=Release.Name), a potem jawne wyjatki per komponent.
Polityki DNS/egress NIE sa ograniczane (poza zakresem, SPEC_ETAP9.md pkt 1).

UWAGA (deploy/kind/uruchom.sh): domyslny CNI kind (kindnet) NIE egzekwuje
NetworkPolicy w ogole - te zasoby istnialyby, ale ruch nie bylby faktycznie
blokowany. Dlatego klaster kind jest tworzony z disableDefaultCNI + Calico
(patrz deploy/kind/kind-config.yaml i uruchom.sh) - dopiero to daje prawdziwe
egzekwowanie, zweryfikowane w test_dymny.sh (punkt d).
*/}}
{{- $fullname := include "underwriter.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-deny-ingress-domyslnie
  labels:
    {{- include "underwriter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-frontend
  labels:
    {{- include "underwriter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "underwriter.selectorLabels" (dict "root" $ "component" "frontend") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Ruch z zewnatrz klastra (NodePort 30080) nie ma wlasnej etykiety pod-selektora,
    # wiec ten wpis jest celowo "z kazdego zrodla" - ograniczony wylacznie do portu
    # frontendu. To jedyny punkt wejscia z zewnatrz w calym wydaniu.
    - ports:
        - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-api
  labels:
    {{- include "underwriter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "underwriter.selectorLabels" (dict "root" $ "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Frontend (proxy /api/*) - jedyny prawdziwy klient API.
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
        # helm test (templates/tests/test-zdrowie.yaml) - wlasny pod testowy musi
        # miec jawny wyjatek, inaczej jego polaczenie do /zdrowie zostanie odrzucone
        # przez te sama polityke, ktora test ma zweryfikowac (SPEC_ETAP9.md pkt 1).
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: helm-test
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-postgres
  labels:
    {{- include "underwriter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "underwriter.selectorLabels" (dict "root" $ "component" "postgres") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # API - w kazdym normalnym requescie.
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
        # Job migracji (job-migracje.yaml) - bez tego wpisu zostalby odciety od
        # Postgresa przez te sama polityke, ktora chroni baze.
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: migracja
      ports:
        - port: 5432
{{- if .Values.azurite.wlaczony }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-azurite
  labels:
    {{- include "underwriter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "underwriter.selectorLabels" (dict "root" $ "component" "azurite") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
      ports:
        - port: 10000
{{- end }}
