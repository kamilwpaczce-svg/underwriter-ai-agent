{{- if .Values.postgres.wewnetrzny }}
{{- $fullname := include "underwriter.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "underwriter.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    {{- include "underwriter.selectorLabels" (dict "root" $ "component" "postgres") | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "underwriter.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ $fullname }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "underwriter.selectorLabels" (dict "root" $ "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "underwriter.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.uzytkownik | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.baza | quote }}
            # PGDATA w podkatalogu montowania zamiast subPath: kubelet zaklada katalog
            # subPath jako root:root, a entrypoint postgresa (uid 999) wywala sie wtedy na
            # "chmod ... Operation not permitted" (sprawdzone na kind/local-path 14.10).
            # Podkatalog tworzy sam initdb, wiec ma wlasciwego wlasciciela.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-postgres
                  key: password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.uzytkownik | quote }}, "-d", {{ .Values.postgres.baza | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.uzytkownik | quote }}, "-d", {{ .Values.postgres.baza | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: dane
              mountPath: /var/lib/postgresql/data
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            # readOnlyRootFilesystem CELOWO pominiete (pozostaje false, domyslne):
            # docker-entrypoint.sh obrazu postgres:17 zapisuje poza PGDATA - m.in.
            # /var/run/postgresql (gniazdo unix), czasem /tmp i pliki konfiguracyjne
            # kopiowane/edytowane przy starcie. Przepiecie wszystkich tych sciezek
            # na emptyDir dla demo-chartu nie jest tego warte - PVC ponizej i tak
            # jest jedynym miejscem, ktore MUSI przetrwac restart poda.
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: dane
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.pojemnoscPvc }}
{{- end }}
