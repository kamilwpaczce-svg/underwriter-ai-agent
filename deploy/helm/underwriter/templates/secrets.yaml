{{/*
Haslo Postgresa + sekret aplikacji (DATABASE_URL, AZURE_STORAGE_CONNECTION_STRING).

Dlaczego oba w jednym pliku: "helm upgrade" musi uzyc TEGO SAMEGO hasla, co przy
"helm install" - inaczej baza na PVC ma stare haslo, a nowy Secret inne (API nie
polaczy sie z Postgresem). Haslo odczytujemy z juz istniejacego Secretu (`lookup`)
zamiast generowac je przy kazdym renderze. `lookup` nie dziala przy "helm template"
(offline, bez polaczenia z klastrem) - wtedy zawsze zwraca pusty wynik, wiec
tests/test_helm.py renderuje nowy losowy haslo przy kazdym uruchomieniu; to nie
szkodzi (test nie sprawdza stabilnosci hasla - to robi test dymny na prawdziwym
klastrze, deploy/kind/test_dymny.sh, przez "helm upgrade" po "helm install").

Oba to ZWYKLE zasoby wydania (nie hooki): naleza do release'u, "helm uninstall" je
usuwa. Kolejnosc wzgledem migracji zalatwia job-migracje.yaml (czeka na Postgresa),
nie kolejnosc tworzenia zasobow.
*/}}
{{- $fullname := include "underwriter.fullname" . -}}
{{- $pgSecretName := printf "%s-postgres" $fullname -}}
{{- $pgSecret := lookup "v1" "Secret" .Release.Namespace $pgSecretName -}}
{{- $pgPassword := randAlphaNum 24 -}}
{{- if $pgSecret -}}
{{- $pgPassword = index $pgSecret.data "password" | b64dec -}}
{{- end -}}
{{- if .Values.postgres.wewnetrzny }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pgSecretName }}
  labels:
    {{- include "underwriter.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    # keep: Secret zyje tak dlugo jak PVC bazy (PVC StatefulSetu tez nie znika przy
    # "helm uninstall" ani przy postgres.wewnetrzny=false). Bez tego Helm kasowal haslo,
    # a ponowna instalacja generowala NOWE - niezgodne z baza na starym PVC
    # (sprawdzone na kind 14.10). Pelne sprzatanie: kind delete cluster albo reczne
    # "kubectl delete secret/pvc".
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $pgPassword | quote }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-app
  labels:
    {{- include "underwriter.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
stringData:
  DATABASE_URL: >-
    {{ ternary
      (printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.postgres.uzytkownik $pgPassword $fullname .Values.postgres.baza)
      .Values.postgres.zewnetrznyDatabaseUrl
      .Values.postgres.wewnetrzny }}
  AZURE_STORAGE_CONNECTION_STRING: >-
    {{ ternary
      (printf "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://%s-azurite:10000/devstoreaccount1;" $fullname)
      .Values.azurite.zewnetrznyConnectionString
      .Values.azurite.wlaczony }}
