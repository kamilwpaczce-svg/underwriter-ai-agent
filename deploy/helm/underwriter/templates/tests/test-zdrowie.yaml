{{- $fullname := include "underwriter.fullname" . -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ $fullname }}-test-zdrowie
  labels:
    {{- include "underwriter.labels" . | nindent 4 }}
    # Etykieta dopuszczona jawnie w allow-api (templates/networkpolicy.yaml) -
    # bez niej "helm test" dostalby timeout z tej samej polityki, ktora chroni API.
    app.kubernetes.io/component: helm-test
  annotations:
    helm.sh/hook: test
    # before-hook-creation: po nieudanym "helm test" pod zostaje (do obejrzenia logow),
    # a kolejne "helm test" i tak musi moc go utworzyc od nowa.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      imagePullPolicy: IfNotPresent
      command:
        - "curl"
        - "--fail"
        - "--silent"
        - "--show-error"
        - "--max-time"
        - "10"
        - "http://{{ $fullname }}-api:8000/zdrowie"
      securityContext:
        runAsNonRoot: true
        # curlimages/curl ma "USER curl_user" (nazwa) - uid liczbowo, patrz _helpers.tpl.
        runAsUser: 100
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
        readOnlyRootFilesystem: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
