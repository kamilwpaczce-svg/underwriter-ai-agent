# Etap 12 - Qdrant jako trzecia wyszukiwarka RAG po OWU (serwer, zamiast trybu embedded
# QDRANT_PATH). NIE TESTOWANE na tej maszynie - Docker Desktop byl wylaczony podczas pracy nad
# tym etapem (patrz README/SPEC_ETAP12.md); wszystkie przebiegi uzywaly QDRANT_PATH.
#
#   docker compose -f docker-compose.qdrant.yml up -d
#   # potem w .env: QDRANT_URL=http://localhost:6333
#
# Tag v1.19.2 - aktualny stabilny wydany tag na Docker Hub (sprawdzony 2026-10-17), zgodny
# z zainstalowanym qdrant-client==1.19.1 (serwer nowszy niz klient jest wspierany przez Qdrant).
services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "6333:6333"  # REST + dashboard (http://localhost:6333/dashboard)
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_dane:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qdrant_dane:
