services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: underwriter
      POSTGRES_PASSWORD: underwriter
      POSTGRES_DB: underwriter
    ports:
      - "5432:5432"
    volumes:
      - postgres_dane:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U underwriter -d underwriter"]
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    # --skipApiVersionCheck: zainstalowany azure-storage-blob (12.31.0) wysyla
    # wersje API nowsza niz ten obraz Azurite rozumie - oficjalna flaga Azurite
    # na dokladnie ten przypadek (patrz komunikat bledu HttpResponseError).
    command: "azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck"
    ports:
      - "10000:10000"

  api:
    build: .
    profiles: ["api"]
    environment:
      DATABASE_URL: postgresql://underwriter:underwriter@postgres:5432/underwriter
      AZURE_STORAGE_CONNECTION_STRING: >-
        DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      KONTENER_BLOB: wnioski
      MODEL_AGENTA: atrapa
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    profiles: ["frontend"]
    environment:
      # Etap 6: zmienna runtime (nie buildowa) - przegladarka nigdy jej nie widzi,
      # czyta ja tylko route handler proxy po stronie serwera Next.js. W sieci
      # compose uslugi widza sie po nazwie serwisu, stad "api", nie "localhost".
      API_URL_WEWNETRZNY: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_dane:
